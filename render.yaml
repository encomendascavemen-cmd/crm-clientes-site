services:
  - type: web
    name: cavemen-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    envVars:
      - key: MAGENTO_URL
        value: https://www.cavemenstore.com
      - key: MAGENTO_USER
        value: marketing@cavemenstore.com
      - key: MAGENTO_PASS
        sync: false
      - key: DATABASE_URL
        sync: false
