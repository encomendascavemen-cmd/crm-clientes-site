name: Google Ads Enhanced Conversions

# Corre todos os dias às 23:30 Lisboa (22:30 UTC) — e permite correr à mão
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  send-conversions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-ads

      - name: Run Google Ads conversions
        env:
          MOLONI_CLIENT_ID:              ${{ secrets.MOLONI_CLIENT_ID }}
          MOLONI_CLIENT_SECRET:          ${{ secrets.MOLONI_CLIENT_SECRET }}
          MOLONI_USERNAME:               ${{ secrets.MOLONI_USERNAME }}
          MOLONI_PASSWORD:               ${{ secrets.MOLONI_PASSWORD }}
          MOLONI_COMPANY_ID:             ${{ secrets.MOLONI_COMPANY_ID }}
          GOOGLE_DEVELOPER_TOKEN:        ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CLIENT_ID:              ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:          ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:          ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CUSTOMER_ID:            ${{ secrets.GOOGLE_CUSTOMER_ID }}
          GOOGLE_CONVERSION_ACTION_ID:   ${{ secrets.GOOGLE_CONVERSION_ACTION_ID }}
        run: python google_offline_conversions.py
