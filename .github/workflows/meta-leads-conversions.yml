name: Meta Leads Conversions (Fato Noivo)

# Envia ao pixel da Conta Leads apenas vendas com Fato Noivo
on:
  schedule:
    - cron: "*/30 * * * *"  # A cada 30 minutos
  workflow_dispatch:

jobs:
  send-conversions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Meta Leads conversions
        env:
          MOLONI_CLIENT_ID:        ${{ secrets.MOLONI_CLIENT_ID }}
          MOLONI_CLIENT_SECRET:    ${{ secrets.MOLONI_CLIENT_SECRET }}
          MOLONI_USERNAME:         ${{ secrets.MOLONI_USERNAME }}
          MOLONI_PASSWORD:         ${{ secrets.MOLONI_PASSWORD }}
          MOLONI_COMPANY_ID:       ${{ secrets.MOLONI_COMPANY_ID }}
          META_LEADS_DATASET_ID:   ${{ secrets.META_LEADS_DATASET_ID }}
          META_LEADS_ACCESS_TOKEN: ${{ secrets.META_LEADS_ACCESS_TOKEN }}
          META_ACCESS_TOKEN:       ${{ secrets.META_ACCESS_TOKEN }}
        run: python meta_leads_conversions.py
